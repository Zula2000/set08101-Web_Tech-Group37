<!DOCTYPE html>
<html>
<head>
  <title>To the End</title>
  <link rel="stylesheet" href="../css/Megen Style.css" type="text/css"
</head>
<body>

  <h1>Adventure Game</h1>
  <p class="intro">You have gone west!</p>

  <!-- Start Screen -->
  <div id="start-screen">
    <p>Adverturer! I forgot you name, what was it again?</p>
    <input type="text" id="playerName" placeholder="Enter your name" />
    <br><br>
    <button class="button" onclick="startGame()">Continue</button>
  </div>

  <!-- Game Content -->
  <div class="content" id="game" style="display: none;">
    <!-- Story will go here -->
  </div>

  <script>
    let player = "Adventurer";
  
    function startGame() {
      const input = document.getElementById("playerName").value;
      if (input.trim() !== "") {
        player = input;
      }
  
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("game").style.display = "block";
  
      updateStory(`
        <p>${player}, you find a mysterious chest glowing softly in the center of the room.<br>
        What will you do?</p>
        <button class="button" onclick="openChest()">Open the Chest</button>
        <button class="button" onclick="leaveChest()">Leave it Alone</button>
      `);
    }
  
    function updateStory(html) {
      document.getElementById("game").innerHTML = html;
    }
  
    function openChest() {
      updateStory(`
        <p>You open the chest and find an ancient scroll and a crystal that pulses with light. 🧾💎<br>
        Your journey of magic and mystery begins...</p>
      `);
    }
  
    function leaveChest() {
      updateStory(`
        <p>You leave the chest untouched. As you walk away, a peaceful silence fills the room.<br>
        Maybe some mysteries are better left unsolved.</p>
      `);
    }
  </script>

</body>
</html>
