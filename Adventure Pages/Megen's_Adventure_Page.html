<!DOCTYPE html>
<!-- Megan's Page -->
<html>
<head>
  <title>To the End</title>
  <link rel="stylesheet" href="../css/Megen Style.css" type="text/css">
  <link rel="stylesheet" href="../css/navbar_style.css" type="text/css">
  <div class="topnav">
      <a href="https://zula2000.github.io/set08101-Web_Tech-Group37/">Home Page</a>
      <a href="https://zula2000.github.io/set08101-Web_Tech-Group37/Adventure%20Pages/Credits.html">Credits</a>
  </div>
  <br>
</head>
<body>

  <h1>Adventure Game</h1>
  <p class="intro">You have gone west!</p>


  <div id="start-screen">
    <p>Adverturer! I forgot you name, what was it again?</p>
    <input type="text" id="playerName" placeholder="Enter your name" />
    <br><br>
    <button class="button" onclick="startGame()">Continue</button>
  </div>


  <div class="content" id="game" style="display: none;">
    
  </div>

  <script>
    let player = "Adventurer";
  
    function startGame() {
      const input = document.getElementById("playerName").value;
      if (input.trim() !== "") {player = input;}
  
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("game").style.display = "block";
  
      updateStory(`
        <p>${player}, you find a mysterious chest glowing softly in the center of the room.<br>
        What will you do?</p>
        <button class="button" onclick="openChest()">Open the Chest</button>
        <button class="button" onclick="leaveChest()">Leave it Alone</button>`); }
  
    function updateStory(html) { document.getElementById("game").innerHTML = html; }
  
    function openChest() {
      updateStory(`
        <p>You open the chest and find an ancient scroll and a crystal that has a mysterious glow<br>
        Your journey of magic now beigns!</p>`); }
  
    function leaveChest() { updateStory(`  <p>You leave the chest untouched. As you walk away, a silence fills the room.<br> Maybe some mysteries are better left unsolved.</p> `);  }
  </script>
</body>
</html>
